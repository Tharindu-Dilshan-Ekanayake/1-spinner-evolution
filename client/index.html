    <title>+1 Spinner Evolution</title>

    <!-- Boxity SDK (window.Legion.SDK), always from Boxity, never bundled: party play
         depends on it. It reads which environment it is in (prod, stage, local) from
         the platform, so this one URL works everywhere.
         async: it must not hold up the game's own scripts. bloxity/sdk.js waits for
         it to appear, whatever order the two finish loading in, and nothing reaches
         the matchmaker before it has. -->
    <script async src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
